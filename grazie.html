<!DOCTYPE html>
<html lang="it" class="dark">

<head>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 640 512%22><path fill=%22%2300d2ff%22 d=%22M392.8 1.2c-17-4.9-34.7 5-39.6 22l-128 448c-4.9 17 5 34.7 22 39.6s34.7-5 39.6-22l128-448c4.9-17-5-34.7-22-39.6zm80.6 120.1c-12.5 12.5-12.5 32.8 0 45.3L562.7 256l-89.4 89.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l112-112c12.5-12.5 12.5-32.8 0-45.3l-112-112c-12.5-12.5-32.8-12.5-45.3 0zm-306.2 0c-12.5-12.5-32.8-12.5-45.3 0l-112 112c-12.5 12.5-12.5 32.8 0 45.3l112 112c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L77.3 256l89.4-89.4c12.5-12.5 12.5-32.8 0-45.3z%22/></svg>">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grazie per l'acquisto - Progetto C++ Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-image: linear-gradient(to bottom, rgba(7, 11, 25, 0.85), rgba(7, 11, 25, 0.95)), url('image.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body class="text-gray-200 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <div
        class="bg-[#0f172a]/90 border border-blue-900/60 p-8 rounded-2xl text-center max-w-lg shadow-2xl backdrop-blur w-full">
        <div
            class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl border border-blue-500/30">
            <i class="fa-solid fa-check"></i>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Pagamento completato!</h1>
        <p class="text-gray-300 text-sm mb-6 leading-relaxed">
            Grazie per il tuo acquisto. Il file che hai sbloccato è pronto per il download sicuro.
        </p>

        <!-- Container dinamico isolato -->
        <div id="download-container" class="flex flex-col gap-4">
            <!-- Il contenuto viene inserito dinamicamente da JavaScript -->
        </div>

        <div class="mt-8 pt-4 border-t border-blue-900/40 text-xs text-gray-400">
            <p>Salva il file in un luogo sicuro. In caso di problemi, contatta il supporto.</p>
            <a href="index.html" class="text-cyan-400 hover:underline mt-2 inline-block font-medium">← Torna alla
                Home</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const prodotto = urlParams.get('prodotto');
        const container = document.getElementById('download-container');

        if (prodotto === 'ssh') {
            container.innerHTML = `
                <div class="bg-blue-950/40 border border-blue-900/60 p-5 rounded-xl flex flex-col items-center gap-3">
                    <span class="text-sm font-semibold text-white">Prodotto: <span class="text-cyan-400">SSH-Manager</span></span>
                    <a href="repo/SSH-Manager.deb" download
                        class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-6 py-3 rounded-lg transition shadow-md inline-flex items-center space-x-2 w-full justify-center">
                        <i class="fa-solid fa-download"></i>
                        <span>Scarica SSH-Manager.deb</span>
                    </a>
                </div>
            `;
        } else if (prodotto === 'ping') {
            container.innerHTML = `
                <div class="bg-blue-950/40 border border-blue-900/60 p-5 rounded-xl flex flex-col items-center gap-3">
                    <span class="text-sm font-semibold text-white">Prodotto: <span class="text-cyan-400">Lib-Ping</span></span>
                    <a href="repo/Lib-Ping.zip" download
                        class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-6 py-3 rounded-lg transition shadow-md inline-flex items-center space-x-2 w-full justify-center">
                        <i class="fa-solid fa-download"></i>
                        <span>Scarica Lib-Ping.zip</span>
                    </a>
                </div>
            `;
        } else {
            container.innerHTML = `
                <div class="p-4 bg-red-950/30 border border-red-900/50 rounded-xl text-red-300 text-xs">
                    Nessun prodotto valido specificato o accesso non autorizzato alla pagina di download.
                </div>
            `;
        }
    </script>

</body>

</html>
